spring:
  application.name: gateway
  profiles.default: normal       # "ordem-errada" substitui as rotas (CL04-10)
server.port: ${PORT:8080}
eureka.instance.instance-id: ${spring.application.name}:${random.value}
spring.cloud.gateway.server.webflux.default-filters:
  - AddResponseHeader=X-Gateway, s10
# CL08-11: tracing no gateway; sem coletor por padrão (ligue com TRACING_EXPORT=true e o endpoint OTLP)
management:
  tracing.sampling.probability: 1.0
  tracing.export.otlp.enabled: ${TRACING_EXPORT:false}
  otlp.metrics.export.enabled: false
