# CL06-15: circuit breaker no Gateway. Em caso de falha/timeout/circuito aberto, encaminha para /fallback (interno).
spring.cloud.gateway.server.webflux.routes:
  - id: catalog-cb
    uri: ${CATALOG_URI:lb://catalog}
    predicates: [ "Path=/cb/catalog/**" ]
    filters:
      - StripPrefix=2
      - name: CircuitBreaker
        args:
          name: catalogCb
          fallbackUri: forward:/fallback
resilience4j:
  circuitbreaker.instances.catalogCb:
    sliding-window-size: 4
    minimum-number-of-calls: 4
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
  timelimiter.instances.catalogCb.timeout-duration: 500ms
