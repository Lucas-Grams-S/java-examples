spring:
  application.name: orders               # o gateway (04) roteia lb://orders
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer.properties.max.block.ms: 2000      # broker fora do ar: falha rápido e o Outbox tenta de novo
server:
  port: ${PORT:8080}
  shutdown: graceful
catalog.url: ${CATALOG_URL:http://catalog}      # "catalog" = nome no Eureka (balanceado); em Kubernetes, o Service "catalog"
catalog.balanced: ${CATALOG_BALANCED:true}      # false: URL direta (Kubernetes resolve por DNS)
catalog.timeout: 1s
outbox.enabled: ${OUTBOX_ENABLED:true}
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info
  tracing.sampling.probability: ${TRACING_SAMPLING:0.0}
  tracing.export.zipkin.endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  client.enabled: ${EUREKA_ENABLED:true}
  instance.instance-id: ${spring.application.name}:${random.value}
