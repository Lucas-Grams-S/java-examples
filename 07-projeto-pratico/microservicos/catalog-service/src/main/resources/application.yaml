spring:
  application.name: catalog              # o gateway (04) roteia lb://catalog
  config.import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer.auto-offset-reset: earliest
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoint.health.probes.enabled: true
  endpoints.web.exposure.include: health,info
  tracing.sampling.probability: ${TRACING_SAMPLING:0.0}   # 1.0 no laboratório (PP12); sem Zipkin, 0 evita ruído
  tracing.export.zipkin.endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  client.enabled: ${EUREKA_ENABLED:true}
  instance.instance-id: ${spring.application.name}:${random.value}
